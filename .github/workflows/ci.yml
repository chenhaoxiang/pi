name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build community
        if: github.repository != 'chenhaoxiang/pi'
        run: npm run build

      # Fork CI tests the reviewed release snapshot, not mutable online prices.
      # Updating this pin is an explicit catalog change; keep all checks/tests below.
      - name: Build fork with verified release model data
        if: github.repository == 'chenhaoxiang/pi'
        run: |
          mkdir -p tmp/ci-model-data
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/chenhaoxiang/pi/releases/download/v1.0.4-fork.1/earendil-works-pi-ai-1.0.4-fork.1.tgz \
            --output tmp/ci-model-data/pi-ai.tgz
          echo 'ae27b061b1aa67619df58e58c21cc8ded2bfaa7fe390cb60a10bad263a3f93c6  tmp/ci-model-data/pi-ai.tgz' | sha256sum --check --strict
          tar -xzf tmp/ci-model-data/pi-ai.tgz --directory tmp/ci-model-data package/dist/providers/data
          mkdir -p packages/ai/src/providers/data
          cp -R tmp/ci-model-data/package/dist/providers/data/. packages/ai/src/providers/data/
          npm run build:offline

      - name: Check
        run: npm run check

      - name: Build the pi-env daemon
        run: npm run build:daemon --workspace packages/env

      - name: Test
        run: npm test

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs pi's MCP client from source against the pinned official conformance suite and fails on
      # regressions against packages/coding-agent/test/mcp-conformance/baseline.json.
      - name: MCP client conformance
        run: npm run test:mcp-conformance
